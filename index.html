<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공공데이터 CSV 시각화 도구</title>
    
    <!-- Tailwind CSS (기본 스타일링용) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js (그래프 시각화) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- PapaParse (CSV 전문 파서: 인코딩 완벽 지원) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">📊 공공데이터 CSV 전용 시각화 도구</h1>

        <!-- 컨트롤 패널 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-blue-50 p-5 rounded-lg border border-blue-100">
            <!-- 1. 파일 업로드 -->
            <div class="col-span-1 md:col-span-2">
                <label class="block text-sm font-bold text-gray-700 mb-2">1. CSV 파일 업로드</label>
                <input type="file" id="fileInput" accept=".csv" 
                    class="block w-full text-sm text-gray-600 
                    file:mr-4 file:py-2 file:px-4 
                    file:rounded-md file:border-0 
                    file:text-sm file:font-semibold 
                    file:bg-blue-600 file:text-white 
                    hover:file:bg-blue-700 cursor-pointer bg-white border border-gray-300 rounded-md">
            </div>

            <!-- 2. 인코딩 선택 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">2. 인코딩 (글자 깨짐 시 변경)</label>
                <select id="encodingSelect" class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="EUC-KR" selected>EUC-KR (공공데이터 기본)</option>
                    <option value="UTF-8">UTF-8</option>
                </select>
            </div>
            
            <!-- 3. 차트 종류 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">3. 차트 종류</label>
                <select id="chartTypeSelect" class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white">
                    <option value="bar">막대 그래프 (Bar)</option>
                    <option value="line">선 그래프 (Line)</option>
                </select>
            </div>
        </div>

        <!-- 축 설정 패널 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">X축 설정 (기준 데이터)</label>
                <select id="xAxisSelect" class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm bg-white disabled:bg-gray-100 disabled:text-gray-400" disabled>
                    <option>데이터를 먼저 업로드하세요</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Y축 설정 (수치 데이터)</label>
                <select id="yAxisSelect" class="block w-full rounded-md border border-gray-300 py-2.5 px-3 text-sm bg-white disabled:bg-gray-100 disabled:text-gray-400" disabled>
                    <option>데이터를 먼저 업로드하세요</option>
                </select>
            </div>
        </div>

        <!-- 차트 영역 -->
        <div class="relative h-[500px] w-full border border-gray-200 rounded-lg p-4 bg-white flex items-center justify-center">
            <p id="placeholderText" class="text-gray-400 text-lg absolute">📂 CSV 파일을 업로드하면 이곳에 차트가 표시됩니다.</p>
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <script>
        // 전역 변수
        let globalData = [];
        let headers = [];
        let chartInstance = null;

        // DOM 요소
        const fileInput = document.getElementById('fileInput');
        const encodingSelect = document.getElementById('encodingSelect');
        const chartTypeSelect = document.getElementById('chartTypeSelect');
        const xAxisSelect = document.getElementById('xAxisSelect');
        const yAxisSelect = document.getElementById('yAxisSelect');
        const placeholderText = document.getElementById('placeholderText');
        const ctx = document.getElementById('myChart').getContext('2d');

        // 1. CSV 파싱 로직 (PapaParse 활용)
        function parseCSV() {
            const file = fileInput.files[0];
            if (!file) return;

            const selectedEncoding = encodingSelect.value;

            Papa.parse(file, {
                encoding: selectedEncoding,
                header: true,         // 첫 줄을 헤더로 인식
                skipEmptyLines: true, // 빈 줄 무시
                complete: function(results) {
                    globalData = results.data;
                    
                    if (globalData.length > 0) {
                        headers = Object.keys(globalData[0]);
                        updateAxisSelects();
                        drawChart();
                    }
                },
                error: function(err) {
                    alert("파일을 읽는 중 문제가 발생했습니다: " + err.message);
                }
            });
        }

        // 2. 드롭다운(X축, Y축) 옵션 업데이트
        function updateAxisSelects() {
            xAxisSelect.innerHTML = '';
            yAxisSelect.innerHTML = '';
            xAxisSelect.disabled = false;
            yAxisSelect.disabled = false;

            headers.forEach(header => {
                xAxisSelect.add(new Option(header, header));
                yAxisSelect.add(new Option(header, header));
            });

            // Y축의 기본값은 보통 숫자가 많은 두 번째 열로 설정
            if (headers.length > 1) {
                yAxisSelect.selectedIndex = 1;
            }
        }

        // 3. 차트 그리기 로직
        function drawChart() {
            if (!globalData || globalData.length === 0) return;

            placeholderText.style.display = 'none'; // 안내 문구 숨김

            const xAxis = xAxisSelect.value;
            const yAxis = yAxisSelect.value;
            const chartType = chartTypeSelect.value;

            const labels = [];
            const dataValues = [];

            // 데이터 정제 및 추출
            globalData.forEach(row => {
                // X축 데이터 추출
                labels.push(row[xAxis] || 'N/A');
                
                // Y축 데이터 추출 및 정제 (공공데이터의 1,000 단위 콤마 제거)
                let rawValue = row[yAxis];
                if (typeof rawValue === 'string') {
                    rawValue = rawValue.replace(/,/g, ''); // 모든 콤마 제거
                }
                
                const numValue = parseFloat(rawValue);
                dataValues.push(isNaN(numValue) ? 0 : numValue);
            });

            // 기존 차트가 있다면 파괴 후 재생성
            if (chartInstance) {
                chartInstance.destroy();
            }

            // Chart.js 렌더링
            chartInstance = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [{
                        label: yAxis,
                        data: dataValues,
                        backgroundColor: 'rgba(59, 130, 246, 0.6)', // 파란색 반투명
                        borderColor: 'rgb(37, 99, 235)',         // 진한 파란색
                        borderWidth: 1,
                        borderRadius: chartType === 'bar' ? 4 : 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                font: { family: "'Malgun Gothic', sans-serif", size: 14 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { font: { family: "'Malgun Gothic', sans-serif" } }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { font: { family: "'Malgun Gothic', sans-serif" } }
                        }
                    }
                }
            });
        }

        // 이벤트 리스너 등록
        fileInput.addEventListener('change', parseCSV);
        encodingSelect.addEventListener('change', () => {
            if (fileInput.files.length > 0) parseCSV(); // 인코딩 변경 시 즉시 재파싱
        });
        chartTypeSelect.addEventListener('change', drawChart);
        xAxisSelect.addEventListener('change', drawChart);
        yAxisSelect.addEventListener('change', drawChart);
    </script>
</body>
</html>
